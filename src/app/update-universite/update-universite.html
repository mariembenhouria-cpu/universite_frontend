
<div class="container mt-4">

  <div class="card shadow border-0">

    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">
        <i class="bi bi-pencil-square"></i>
        Modifier une université
      </h4>
    </div>

    <div class="card-body p-4">

      <!-- Chargement -->
      <div *ngIf="loading" class="text-center">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2">Chargement des informations...</p>
      </div>

      <!-- Erreur -->
      <div *ngIf="erreur" class="alert alert-danger">
        {{ erreur }}
      </div>

      <!-- Formulaire -->
      <form
        *ngIf="!loading && currentUniversite"
        (ngSubmit)="updateUniversite()"
        #f="ngForm">

        <div class="mb-3">
          <label class="form-label">Nom université :</label>
          <input
            type="text"
            class="form-control"
            name="nomuniversite"
            [(ngModel)]="currentUniversite.nomuniversite"
            required>
        </div>

        <div class="mb-3">
          <label class="form-label">Ville :</label>
          <input
            type="text"
            class="form-control"
            name="villeuniversite"
            [(ngModel)]="currentUniversite.villeuniversite"
            required>
        </div>

        <div class="mb-3">
          <label class="form-label">Nombre d'étudiants :</label>
          <input
            type="number"
            class="form-control"
            name="nombre_etudiants"
            [(ngModel)]="currentUniversite.nombre_etudiants"
            required
            min="0">
        </div>

        <div class="mb-3">
          <label class="form-label">Date de création :</label>
          <input
            type="date"
            class="form-control"
            name="dateCreation"
            [(ngModel)]="currentUniversite.dateCreation"
            required>
        </div>

        <div class="mb-4">
          <label class="form-label">Classification :</label>
          <select
            class="form-select"
            name="classification"
            [(ngModel)]="selectedClassificationId"
            required>

            <option [ngValue]="null" disabled>
              Choisir une classification
            </option>

            <option
              *ngFor="let clas of classifications"
              [ngValue]="clas.idClassification">
              {{ clas.nomClassification }}
            </option>

          </select>
        </div>

        <div class="d-flex gap-2">

          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="f.invalid">
            <i class="bi bi-check-circle"></i>
            Enregistrer
          </button>

          <button
            type="button"
            class="btn btn-secondary"
            (click)="router.navigate(['/universities'])">
            <i class="bi bi-arrow-left"></i>
            Annuler
          </button>

        </div>

      </form>

    </div>
  </div>

</div>
