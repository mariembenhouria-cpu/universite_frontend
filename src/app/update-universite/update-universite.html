
<div class="container mt-4">

  <div class="mb-4">
    <h2>Modifier une université :</h2>
  </div>

  <!-- Chargement -->
  <div *ngIf="loading" class="text-center">
    <p>Chargement des informations...</p>
  </div>

  <!-- Erreur -->
  <div *ngIf="erreur" class="alert alert-danger">
    {{ erreur }}
  </div>

  <!-- Formulaire -->
  <form *ngIf="!loading && currentUniversite"
        (ngSubmit)="updateUniversite()">

    <div class="col-sm-2 col-md-2 col-lg-2 mb-3">
      <label>ID Université</label>
      <input
        type="number"
        [(ngModel)]="currentUniversite.iduniversite"
        name="iduniversite"
        class="form-control"
        readonly>
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
      <label>Nom Université</label>
      <input
        type="text"
        [(ngModel)]="currentUniversite.nomuniversite"
        name="nomuniversite"
        class="form-control"
        required>
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
      <label>Ville université</label>
      <select
        [(ngModel)]="currentUniversite.villeuniversite"
        name="villeuniversite"
        class="form-control"
        required>

        <option value="Tunis">Tunis</option>
        <option value="Sousse">Sousse</option>
        <option value="Sfax">Sfax</option>
        <option value="Nabeul">Nabeul</option>

      </select>
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
      <label>Nombre des étudiants</label>
      <input
        type="number"
        [(ngModel)]="currentUniversite.nombre_etudiants"
        name="nombre_etudiants"
        class="form-control"
        required>
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
      <label>Date de Création</label>
      <input
        type="date"
        [ngModel]="currentUniversite.dateCreation | date:'yyyy-MM-dd'"
        (ngModelChange)="currentUniversite.dateCreation = $event"
        name="dateCreation"
        class="form-control"
        required>
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4 mt-2 mb-3">
      <label>Classification</label>

      <select
        class="form-control"
        name="classification"
        [(ngModel)]="selectedClassificationId"
        required>

        <option [ngValue]="null" disabled>
          Choisir une classification
        </option>

        @for (c of classifications; track c.idClassification) {
          <option [ngValue]="c.idClassification">
            {{ c.nomClassification }}
          </option>
        }

      </select>
    </div>

    <div class="mt-3">
      <button
        type="submit"
        class="btn btn-success"
        [disabled]="classifications.length === 0">
        Modifier
      </button>
    </div>

  </form>

</div>
