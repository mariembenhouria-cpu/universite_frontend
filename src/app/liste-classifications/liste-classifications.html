<div class="container">
     <div class="col-sm-4 col-md-4 col-lg-4 mb-4">
     <app-update-classification [classification]="updatedclassif" [ajout]="ajout"
     (classificationUpdated)="classificationUpdated($event)"></app-update-classification>
     
</div>
<div class="card shadow mb-4">
<div class="card-body">
<table class="table table-striped">
<thead>
<tr> <th>Id</th><th>Nom Classification</th> </tr>
</thead>
@for(cat of classifications; track cat.idClassification)
{
<tbody >
<tr>
<td>{{cat.idClassification}}</td>
<td>{{cat.nomClassification}}</td>
<td><a class="btn btn-success" (click)="updateClassification(cat)">Editer</a></td>

</tr>
</tbody>
}
</table>
</div>
</div>
</div>
