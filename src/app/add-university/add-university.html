
<div class="container">
  <h2>Ajouter une université :</h2>

  <form>
    <!--<div class="col-sm-2 col-md-2 col-lg-2">
      <label>ID Université</label>
      <input
        type="number"
        [(ngModel)]="newUniversite.iduniversite"
        name="iduniversite"
        class="form-control">
    </div>-->

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Nom Université</label>
      <input
        type="text"
        [(ngModel)]="newUniversite.nomuniversite"
        name="nomuniversite"
        class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Ville université</label>
      <select
        [(ngModel)]="newUniversite.villeuniversite"
        name="villeuniversite"
        class="form-control">

        <option value="Tunis">Tunis</option>
        <option value="Sousse">Sousse</option>
        <option value="Sfax">Sfax</option>
        <option value="Nabeul">Nabeul</option>
      </select>
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Nombre des étudiants</label>
      <input
        type="number"
        [(ngModel)]="newUniversite.nombre_etudiants"
        name="nombre_etudiants"
        class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Date de Création</label>
      <input
        type="date"
        [(ngModel)]="newUniversite.dateCreation"
        name="dateCreation"
        class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4 mt-2">
      <label>Classification</label>

      <select
        class="form-control"
        name="idClassification"
        [(ngModel)]="newIdclassification">

        <option [ngValue]="null" disabled>
          Choisir une classification
        </option>

        @for (c of classifications; track c.idClassification) {
          <option [ngValue]="c.idClassification">
            {{ c.nomClassification }}
          </option>
        }

      </select>
    </div>

    <div class="mt-2">
      <button
        type="button"
        (click)="addUniversite()"
        class="btn btn-success">
        Ajouter
      </button>
    </div>

    <div class="mt-2">
      <h3>{{ message }}</h3>
      <p class="text-danger">{{ errorMessage }}</p>
    </div>

  </form>
</div>
